services:
  openosint:
    build: .
    ports:
      # Loopback only by default. To expose on the LAN deliberately:
      #   OPENOSINT_BIND=0.0.0.0 docker compose up
      - "${OPENOSINT_BIND:-127.0.0.1}:8080:8080"
    environment:
      # The container binds 0.0.0.0, which is restricted by default. This
      # declares what the port above is published on; only an exact loopback
      # value lifts the restriction. Never set it to loopback by hand if the
      # port is reachable from other interfaces.
      OPENOSINT_PUBLISHED_BIND: "${OPENOSINT_BIND:-127.0.0.1}"
      # Host-header check (DNS rebinding protection). Add names you reach it by.
      OPENOSINT_ALLOWED_HOSTS: "${OPENOSINT_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      # Lets the browser save API keys (the browser reaches the container over the Docker
      # bridge, not loopback). Unset = saving from the UI is off; set it in .env or inline.
      OPENOSINT_SETUP_TOKEN: "${OPENOSINT_SETUP_TOKEN:-}"
    # .env is optional: the web UI starts with no keys configured.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./reports:/app/reports
      - openosint-data:/data

volumes:
  openosint-data:
