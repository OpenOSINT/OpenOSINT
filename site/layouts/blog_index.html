{% extends "base.html" %}
{% block main %}
<div class="wrap page">
  <div class="prose">
    <h1>{{ page.title }}</h1>
    <p class="lead">{{ page.intro }}</p>
  </div>
  <ul class="post-list">
    {%- for post in posts %}
    <li>
      <time datetime="{{ post.date }}">{{ post.date }}</time>
      <a href="{{ post.url }}">{{ post.title }}</a>
      <p>{{ post.summary }}</p>
    </li>
    {%- endfor %}
  </ul>
</div>
{% endblock %}
