name: openosint
services:
  - name: web
    github:
      repo: OpenOSINT/OpenOSINT
      branch: main
      deploy_on_push: true
    build_command: pip install -e ".[web]"
    run_command: openosint web --host 0.0.0.0 --port 8080 --no-browser
    environment_slug: python
    instance_size_slug: basic-xxs
    http_port: 8080
    routes:
      - path: /
    envs:
      # Explicit and required: web_server.py fails closed on this var (missing,
      # empty, or malformed also means demo mode ON), so this line is belt and
      # suspenders, not the only thing standing between visitors and the
      # operator's keys. Demo mode blocks /api/chat outright, requires a
      # caller-supplied key (BYOK) for every credentialed tool, and blocks
      # search_breach unconditionally regardless of key source.
      - key: OPENOSINT_DEMO_MODE
        scope: RUN_TIME
        value: "true"
      # No operator provider keys are provisioned here on purpose: demo mode
      # can never use them (chat is blocked, tool execution requires BYOK,
      # breach is blocked outright), so a key that isn't present here can't
      # leak from here even if a future code change reintroduces a fallback
      # bug. Self-hosters set these in their own .env, not this deployment.
